name: LedgerLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (schema contracts, moderation gate, confidence router,
          PII redaction, extraction fallback, approve/reject)
        run: pytest tests/ -v

  build-and-verify-stack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mirrors the "Run the full stack with Docker" workflow from the
      # README (the equivalent of `make up`): build every image and start
      # api, streamlit, prometheus, and grafana together. This validates
      # the Dockerfile and docker-compose.yml actually produce a working
      # stack on every push, without deploying anywhere external.
      - name: Build and start full stack (api, streamlit, prometheus, grafana)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: docker compose up --build -d

      - name: Wait for every service to report healthy
        run: |
          echo "Waiting for API..."
          timeout 90 bash -c 'until curl -sf http://localhost:8090/health; do sleep 3; done'
          echo "Waiting for Streamlit..."
          timeout 90 bash -c 'until curl -sf http://localhost:8511/_stcore/health; do sleep 3; done'
          echo "Waiting for Prometheus..."
          timeout 90 bash -c 'until curl -sf http://localhost:9091/-/healthy; do sleep 3; done'
          echo "Waiting for Grafana..."
          timeout 90 bash -c 'until curl -sf http://localhost:3001/api/health; do sleep 3; done'
          echo "All services healthy."

      - name: Confirm the API's /metrics endpoint is scrapeable
        run: curl -sf http://localhost:8090/metrics | head -5

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
